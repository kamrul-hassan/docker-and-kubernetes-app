name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # GitHub OIDC -> Azure (no stored Azure passwords)

concurrency:
  group: cd-production
  cancel-in-progress: false

env:
  IMAGE_TAG: ${{ github.sha }}

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build-and-push:
    name: Build & push images to ACR
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to ACR
        run: az acr login --name ${{ vars.ACR_NAME }}

      - uses: docker/setup-buildx-action@v3

      - name: Build & push API
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ${{ vars.ACR_NAME }}.azurecr.io/taskflow-api:${{ env.IMAGE_TAG }}
            ${{ vars.ACR_NAME }}.azurecr.io/taskflow-api:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build & push web
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: |
            ${{ vars.ACR_NAME }}.azurecr.io/taskflow-web:${{ env.IMAGE_TAG }}
            ${{ vars.ACR_NAME }}.azurecr.io/taskflow-web:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  deploy:
    name: Deploy to AKS
    needs: build-and-push
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: azure/setup-kubectl@v4

      - uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ vars.AZURE_RESOURCE_GROUP }}
          cluster-name: ${{ vars.AKS_NAME }}

      - name: Ensure kustomize
        run: |
          if ! command -v kustomize >/dev/null; then
            curl -sSfL "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
            sudo mv kustomize /usr/local/bin/
          fi
          kustomize version

      - name: Create namespace and database secret
        env:
          DB_CONNECTION_STRING: ${{ secrets.DB_CONNECTION_STRING }}
        run: |
          kubectl create namespace taskflow --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret generic taskflow-db -n taskflow \
            --from-literal=connection-string="$DB_CONNECTION_STRING" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Set image tags
        working-directory: k8s/overlays/azure
        run: |
          kustomize edit set image \
            taskflow-api=${{ vars.ACR_NAME }}.azurecr.io/taskflow-api:${{ env.IMAGE_TAG }} \
            taskflow-web=${{ vars.ACR_NAME }}.azurecr.io/taskflow-web:${{ env.IMAGE_TAG }}

      - name: Apply manifests
        run: kustomize build k8s/overlays/azure | kubectl apply -f -

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/taskflow-api -n taskflow --timeout=5m
          kubectl rollout status deployment/taskflow-web -n taskflow --timeout=5m

      - name: Show public address
        run: |
          kubectl get ingress taskflow -n taskflow
          IP=$(kubectl get ingress taskflow -n taskflow -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
          echo "### Deployed :rocket:" >> "$GITHUB_STEP_SUMMARY"
          echo "App: http://${IP:-<pending>}/" >> "$GITHUB_STEP_SUMMARY"
