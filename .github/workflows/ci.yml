name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches-ignore: [main]   # main is covered by the CD workflow, which calls this one
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (.NET 10)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: backend/global.json
      - name: Restore
        run: |
          dotnet restore TaskFlow.slnx
          dotnet tool restore
      - name: Build
        run: dotnet build TaskFlow.slnx -c Release --no-restore
      - name: Test
        run: dotnet test TaskFlow.slnx -c Release --no-build --logger trx --results-directory TestResults
      - name: Check EF Core migrations are up to date
        run: dotnet ef migrations has-pending-model-changes --project src/TaskFlow.Api --no-build --configuration Release
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: backend/TestResults

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  manifests:
    name: Kubernetes manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render kustomize overlays
        run: |
          kubectl kustomize k8s/overlays/local > /dev/null
          kubectl kustomize k8s/overlays/azure > /dev/null
          echo "Both overlays render."

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - uses: docker/build-push-action@v6
        with:
          context: frontend
          push: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
